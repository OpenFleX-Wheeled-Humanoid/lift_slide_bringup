lift_slide_defaults:
  ros__parameters:
    can_interface: can3
    node_id: 16
    calibration_file: ""
    default_controller: lift_position_controller
    update_rate: 100

    joint_name: lift_joint
    min_position_m: -0.750
    max_position_m: 0.400
    max_velocity_mps: 0.10
    lower_switch_position_m: 0.000
    home_switch_position_m: 0.650
    upper_switch_position_m: 0.950
    switch_position_tolerance_m: 0.008

    counts_per_meter: 2000000.0
    counts_per_revolution: 10000.0
    profile_acceleration: 50000
    profile_deceleration: 50000
    command_timeout_sec: 0.5
    sdo_timeout_sec: 0.20
    feedback_poll_rate_hz: 20.0
    invert_command: true
    invert_feedback: true

    homing_method: 27
    homing_speed_mps: 0.010
    homing_low_speed_ratio: 0.2
    homing_acceleration: 50000
    homing_timeout_sec: 60.0
    homing_configure_di: true

    di_active_low: true
    di6_not_func: 2
    di4_homing_func: 22
    di5_pot_func: 1
    home_di_channel: 4
    pot_di_channel: 5
    not_di_channel: 6

    controller_manager_delay: 0.0
    joint_state_broadcaster_delay: 2.0
    velocity_controller_delay: 3.0
    position_controller_delay: 3.5
    manual_position_controller_delay: 3.8
    state_controller_delay: 2.5

    start_rviz: true
    rviz_delay: 4.0
    use_sim_time: false
    log_level: info

controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    lift_velocity_controller:
      type: lift_slide_driver/ParamForwardingVelocityController

    lift_position_controller:
      type: lift_slide_driver/ParamForwardingPositionController

    lift_state_controller:
      type: lift_slide_driver/LiftSlideStateController

    lift_manual_position_controller:
      type: lift_slide_driver/LiftSlideManualPositionController

lift_velocity_controller:
  ros__parameters:
    joints:
      - lift_joint
    interface_name: velocity
    command_topic: /lift_velocity_controller/commands

lift_position_controller:
  ros__parameters:
    joints:
      - lift_joint
    interface_name: position
    command_topic: /lift_position_controller/commands

lift_state_controller:
  ros__parameters:
    joints:
      - lift_joint

lift_manual_position_controller:
  ros__parameters:
    joints:
      - lift_joint
    min_position_m: -0.750
    max_position_m: 0.400
    lower_switch_position_m: 0.000
    home_switch_position_m: 0.650
    upper_switch_position_m: 0.950
    max_velocity_mps: 0.10
    max_acceleration_mps2: 0.08
    max_deceleration_mps2: 0.12
    position_command_min_delta_m: 0.001
    target_tolerance_m: 0.0005
    velocity_tolerance_mps: 0.0005
    jog_target_lookahead_time_s: 0.25
    jog_min_target_lookahead_m: 0.010
